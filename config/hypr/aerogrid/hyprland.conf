# Odin の Hyprland 設定 (Lachesis の AeroSpace の floating 運用を再現)。
# ~/.config/hypr/hyprland.conf (Home Manager が生成) から読み込まれる。
# 保存すると Hyprland が自動で再読込する。

source = ~/.config/hypr/aerogrid/nvidia.conf
source = ~/.config/hypr/aerogrid/keybinds.conf
source = ~/.config/hypr/aerogrid/rules.conf

monitor = , preferred, auto, 1

# noctalia: バー、ランチャー、通知、壁紙、画面ロック、認証ダイアログ、Command+Tab のスイッチャー
exec-once = noctalia
# AeroGrid (Quickshell): Option+Tab のグリッドとウィンドウ配置 (noctalia に無い機能)
exec-once = qs -c aerogrid
exec-once = fcitx5 -d -r

input {
    kb_layout = us
    repeat_delay = 417   # Lachesis の InitialKeyRepeat = 25 (約 417ms)
    repeat_rate = 30     # KeyRepeat = 2 (約 33ms)
    # macOS と同じくクリックでフォーカスする (マウスを乗せただけでは移らない)。
    follow_mouse = 2
    touchpad {
        natural_scroll = true
    }
}

general {
    border_size = 2
    col.active_border = rgb(66b3ff)
    col.inactive_border = rgba(3d3d3daa)
    # すべて floating なので、タイル用の隙間は使わない。
    gaps_in = 0
    gaps_out = 0
    layout = dwindle
}

decoration {
    rounding = 10
    shadow {
        enabled = true
        range = 12
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = quick, 0.2, 0.8, 0.2, 1
    animation = windows, 1, 3, quick, popin 90%
    animation = fade, 1, 3, quick
    # AeroSpace と同じく、ワークスペースの切り替えは一瞬で行う。
    animation = workspaces, 0
}

cursor {
    # ワークスペースを切り替えたらマウスをそのモニタへ (AeroSpace の move-mouse monitor-lazy-center)。
    warp_on_change_workspace = 1
}

binds {
    # 表示中のワークスペースをもう一度呼んでも、直前のものへは戻らない (summon-workspace と同じ)。
    workspace_back_and_forth = false
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    # アプリが自分を前面に出そうとしたとき (通知のクリックなど) にフォーカスを移す。
    focus_on_activate = true
}
