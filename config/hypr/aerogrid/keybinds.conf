# キー割り当て。Magic Keyboard では Option = ALT、Command = SUPER。
#
# Option+文字       そのワークスペースを操作中のモニタに表示 (AeroSpace の summon-workspace)。
#                   別のモニタに表示中なら、2 つのモニタの表示を入れ替える。
# Option+Shift+文字 フォーカス中のウィンドウをそのワークスペースへ移す (追従しない)
# Option+Tab        ワークスペース別のウィンドウグリッド (Quickshell)
# Command+Tab       最近使った順のウィンドウスイッチャー (Quickshell、alt-tab-macos 相当)
# Option+Control+hjkl/Space  ウィンドウ配置 (Quickshell、Raycast 相当)
#
# H/J/K と L はキーなし (AeroSpace と同じ。L は Looking Glass Go 専用)。
# 操作中のモニタは、マウスがあるモニタ (Hyprland の focused monitor)。

# Quickshell (config/quickshell/aerogrid) が受け取るグローバルショートカット
bind = ALT, Tab, global, aerogrid:grid
bind = SUPER, Tab, global, aerogrid:switcher
bind = SUPER SHIFT, Tab, global, aerogrid:switcher-back
bind = ALT CTRL, H, global, aerogrid:left-half
bind = ALT CTRL, L, global, aerogrid:right-half
bind = ALT CTRL, K, global, aerogrid:top-half
bind = ALT CTRL, J, global, aerogrid:bottom-half
bind = ALT CTRL, space, global, aerogrid:maximize

# アプリ (macOS のショートカットに合わせる)
bind = SUPER, space, exec, rofi -show drun        # Raycast / Spotlight
bind = SUPER CTRL, Q, exec, hyprlock              # 画面ロック
bind = SUPER, Q, killactive,                      # アプリを閉じる (ウィンドウ単位)
bind = SUPER SHIFT, 4, exec, grim -g "$(slurp)" - | wl-copy   # 範囲のスクリーンショットをクリップボードへ

# マウス: Command+ドラッグで移動、Command+右ドラッグでサイズ変更
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ワークスペース
