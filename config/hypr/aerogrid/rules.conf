# ウィンドウルール (Lachesis の aerospace.toml の on-window-detected)。
# class は `hyprctl clients` の class 欄で確認できる。最初に一致したワークスペース指定が効く。

# すべてのウィンドウを floating にする。
windowrule = float, class:.*

# Looking Glass Go (Unity)
windowrule = workspace name:L silent, class:^(LookinGirl)$

windowrule = workspace name:W silent, class:^(google-chrome)$
windowrule = workspace name:T silent, class:^(com\.mitchellh\.ghostty)$
windowrule = workspace name:T silent, class:^(code|code-url-handler)$
windowrule = workspace name:T silent, class:^(dev\.zed\.Zed)$
windowrule = workspace name:U silent, class:^(unityhub)$

windowrule = workspace name:A silent, class:^(chatgpt|ChatGPT)$
windowrule = workspace name:S silent, class:^(org\.gnome\.Evince|org\.gnome\.Papers|org\.gnome\.Loupe)$
windowrule = workspace name:D silent, class:^(discord|vesktop)$
windowrule = workspace name:D silent, class:^(Slack)$
windowrule = workspace name:V silent, class:^(parsecd)$
windowrule = workspace name:M silent, class:^(org\.prismlauncher\.PrismLauncher)$
windowrule = workspace name:Z silent, class:^(zoom|Zoom Workplace)$
